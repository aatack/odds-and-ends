[package]
name = "entity-graph-database"
version = "0.1.0"
edition = "2021"
description = "Event-sourced node and link store with branches, on SQLite"
publish = false

[lib]
name = "egdb"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

# Optional, only for the `server` feature. The library has no web
# dependencies by default.
axum = { version = "0.8", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
tokio = { version = "1", optional = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "signal",
] }

[features]
server = ["dep:axum", "dep:tokio", "dep:serde"]

[[bin]]
name = "egdb-server"
path = "src/bin/egdb-server.rs"
required-features = ["server"]

# Only the `server` integration tests use these; the library has no web deps.
[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = "thin"
